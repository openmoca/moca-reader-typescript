name: Release

# Push a vX.Y.Z tag on a commit in main: publishes @openmoca/moca-core to npm with provenance.
# On a pull request to main, the same checks and `npm publish --dry-run` run, so the release path is proved
# before release day; nothing is published.
#
# Trusted publishing: npm accepts this workflow, in the `release` environment, through a short-lived
# OIDC token from GitHub Actions. There is no npm token in this repository. Publish this package
# before moca-tools, whose packages depend on it.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # check:schemas compares the vendored schemas with this moca-spec. Move it with test.yml's pin.
  MOCA_SPEC_REF: fd1e0e0cddc6dac7244e7504951f213ed3fa720e  # release-0.7.0 (0.7.0 release candidate); v0.7.0 once tagged

jobs:
  check:
    name: Check and pack (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: moca-reader-typescript
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: The tag is on main and matches the version
        if: github.event_name == 'push'
        working-directory: moca-reader-typescript
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::package.json is $version, the tag is $GITHUB_REF_NAME"; exit 1; }
      - run: npm ci
        working-directory: moca-reader-typescript
      - run: npm run check:schemas
        working-directory: moca-reader-typescript
        env:
          MOCA_SPEC_DIR: ${{ github.workspace }}/moca-spec
      - run: npm publish --dry-run --access public
        working-directory: moca-reader-typescript

  publish:
    name: Publish to npm
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; this one is pinned exactly.
      - run: npm install -g --ignore-scripts npm@11.21.3
      # This job holds the publishing identity, so it installs without running any package's install scripts.
      # The packages have no build step and no lifecycle scripts of their own.
      - run: npm ci --ignore-scripts
      - run: npm publish --access public
