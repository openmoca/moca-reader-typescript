name: Fuzz

# Coverage-guided fuzzing of the open-and-search path (fuzz/README.md). Short on pull requests; longer nightly,
# with the corpus kept between nightly runs. A crash, timeout or out-of-memory fails the job and uploads the input.
on:
  pull_request:
    paths: ['lib/**', 'fuzz/**', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '600'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Seeds and the package-files base come from the conformance corpus at a fixed ref (moca-spec CONTRIBUTING.md).
  MOCA_SPEC_REF: 9adec0e95c978fda6a16bfda01970ede5f78754b  # v0.7.0

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [open, files]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: moca-reader-typescript
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: moca-reader-typescript
      - run: npm ci
        working-directory: moca-reader-typescript/fuzz
      - run: npm run seed
        working-directory: moca-reader-typescript/fuzz
      - name: Restore the nightly corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: moca-reader-typescript/fuzz/kept-${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      - name: Fuzz
        working-directory: moca-reader-typescript/fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || github.event_name == 'schedule' && '1800' || inputs.seconds }}
          TARGET: ${{ matrix.target }}
        run: |
          kept="kept-$TARGET"; mkdir -p "$kept"
          if [ "$TARGET" = open ]; then seeds=corpus; script=open-search.fuzz.js; len=1048576; else seeds=corpus-files; script=package-files.fuzz.js; len=65536; fi
          # New inputs go to the first corpus folder (kept), seeds are read from the second.
          npx jazzer "$script" "$kept" "$seeds" -i /lib/ -- -rss_limit_mb=4096 -max_len=$len -max_total_time="$SECONDS_PER_TARGET"
      - name: Save the nightly corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: moca-reader-typescript/fuzz/kept-${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: |
            moca-reader-typescript/fuzz/crash-*
            moca-reader-typescript/fuzz/timeout-*
            moca-reader-typescript/fuzz/oom-*
          if-no-files-found: ignore
